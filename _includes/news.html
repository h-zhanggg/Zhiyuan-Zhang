<ul class="news-list">
  {% for item in site.data.news %}
    <li class="news-item{% if item.highlight %} news-item--highlight{% endif %}">
      <span class="news-date">{{ item.date }}</span>
      <span class="news-text">{% if item.emoji %}{{ item.emoji }} {% endif %}{{ item.text | markdownify | remove: '<p>' | remove: '</p>' | strip }}</span>
    </li>
  {% endfor %}
</ul>
